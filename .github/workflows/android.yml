          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = 'f' + (sha[:12] if sha else run)   # BUG-192: the newest picture was deleted and an older one is now newest: new stamp so the app shows it (the app caches by stamp)
          else: stamp = 'c' + (sha[:12] if sha else run)
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('credit-gif-pic/latest.json', 'w'))
          PYCREDIT
              git add -A credit-gif-pic
              if ! git diff --cached --quiet; then git commit -m "Credits picture: newest image is $ENEW"; push_retry; fi
            elif [ -f credit-gif-pic/latest.json ]; then
