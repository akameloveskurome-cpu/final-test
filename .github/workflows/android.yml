            if ! git diff --cached --quiet; then git commit -q -m "Background-allow picture resend marker used"; push_retry; fi
          fi
          if [ -d background-allow-gif-pic ]; then
            BNEW=""; BCOMM=""; BCOUNT=-1
            while IFS= read -r -d '' f; do
              sha=$(git log -1 --format=%H -- "$f" 2>/dev/null || true)
              rank=0; [ -n "$sha" ] && rank=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
              if [ "$rank" -gt "$BCOUNT" ] || { [ "$rank" -eq "$BCOUNT" ] && [[ "$(basename "$f")" > "$BNEW" ]]; }; then BCOUNT=$rank; BNEW=$(basename "$f"); BCOMM=$sha; fi
            done < <(find background-allow-gif-pic -maxdepth 1 -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$BNEW" ]; then
              python3 - "$BNEW" "$BCOMM" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$BMOVED" <<'PYBG'
          import json, subprocess, sys
          name, sha, run, moved = sys.argv[1:5]
          prev = {}
          try: prev = json.load(open('background-allow-gif-pic/latest.json'))
          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = prev['stamp']   # BUG-192: the newest picture was deleted, an older one is now newest: not a new send, keep the stamp (bgallow shows its popup once per stamp)
          else: stamp = 'b' + (sha[:12] if sha else run)
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('background-allow-gif-pic/latest.json', 'w'))
          PYBG
              git add -A background-allow-gif-pic
              if ! git diff --cached --quiet; then git commit -m "Background-allow picture: newest image is $BNEW"; push_retry; fi
