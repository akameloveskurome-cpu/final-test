          fi
          if [ -f package.json ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; echo "No project files yet: upload the zip."; fi

  # decide once whether the installed app changed. Live artwork uploads do not rebuild; the one exception is app-logo-pic/latest.json, which is part of the fingerprint (the logo manifest and the picture it names are the launcher icon baked into the APK).
  # Fingerprint = every file that ends up in the app: src, native-android, scripts, vite / capacitor config, package.json (+ lock), index.html.
  # Also part of the fingerprint: app-logo-pic/latest.json. A NEW logo picture changes its stamp, so the APK is rebuilt and the app offers "Update ready" (the picture is baked in as the launcher icon; the About logo is also downloaded live). The same logo sent again changes nothing (no rebuild).
  plan:
    needs: unpack
    if: needs.unpack.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.p.outputs.code }}
      build: ${{ steps.p.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.ref_name }}" }   # the branch tip, i.e. after the unpack commit
      - name: Fingerprint and compare with the published update manifest
        id: p
        env:
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -e
          CODE=$(python3 scripts/app-fingerprint.py)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # update/latest.json is the source of truth: it is committed ONLY after the APK asset is published.
          # Do not use release notes as the gate: notes can be updated even if a later manifest commit fails.
          PUBLISHED=$(python3 - <<'PYMANIFEST'
          import json
          try:
              print(json.load(open('update/latest.json')).get('code', ''))
          except Exception:
              print('')
          PYMANIFEST
          )
          BUILD=true
          if [ "$CODE" = "$PUBLISHED" ]; then BUILD=false; fi
          if [ "${FORCE_REBUILD:-false}" = "true" ]; then BUILD=true; fi
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "app code $CODE, manifest code ${PUBLISHED:-none}, force rebuild ${FORCE_REBUILD:-false}, build $BUILD"

  # Unit tests (Node plus Pillow-backed logo checks, no browser). The apk job needs this job: a red (or cancelled) test
  # stops the release, so a broken build is never pushed out as a mandatory update. Fix it, then use Re-run failed jobs.
  test:
    needs: [unpack, plan]
    if: needs.unpack.outputs.ready == 'true' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: "test-${{ github.ref }}", cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.ref_name }}" }   # the branch tip, i.e. after the unpack commit
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Prepare Python image test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/test-venv"
          "$RUNNER_TEMP/test-venv/bin/pip" install --quiet pillow pyyaml
          echo "$RUNNER_TEMP/test-venv/bin" >> "$GITHUB_PATH"
      # tests/morph.test.mjs drives a real Chromium through Playwright; without it its 4 tests are SKIPPED. --no-save keeps package.json and the lockfile (and so the app fingerprint) unchanged.
      - name: Install Playwright Chromium (for tests/morph.test.mjs)
        run: |
          npm install --no-save --no-package-lock playwright@1.63.0
          npx playwright install --with-deps chromium
      # a skipped test is a test that did not run: fail the job instead of letting it pass quietly
      - name: Run tests (no test may be skipped)
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/test.log"
          # Node 22 prints the TAP summary ("# skipped 0"), Node 24 the spec summary ("ℹ skipped 0"): accept both, and require a real summary
          if ! grep -qE '^(# |ℹ )skipped 0$' "$RUNNER_TEMP/test.log" || ! grep -qE '^(# |ℹ )fail 0$' "$RUNNER_TEMP/test.log"; then
            echo "::error::Some tests were skipped or failed. Every test must run and pass on GitHub; see the 'SKIP' lines above."
            grep -E 'SKIP|skipped [1-9]' "$RUNNER_TEMP/test.log" || true
            exit 1
          fi

  apk:
    needs: [unpack, plan, test]
    if: needs.unpack.outputs.ready == 'true' && needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: "apk-${{ github.ref }}", cancel-in-progress: false }
    permissions:
      contents: write   # only to publish the APK on the "latest" release (below)
    steps:
      - uses: actions/checkout@v7
        with: { ref: "${{ github.ref_name }}", fetch-depth: 0 }  # complete history for newest-commit app-logo-pic fallback
      # the build job stays on Node 22 (Vite 5 + Capacitor 6 CLI, as built so far); the test job runs on Node 24
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - name: "App code id (from the plan job) and a rising versionCode"
        id: ver
        run: |
          # compute from the exact checkout that is built. The hash is the app identity;
          # package.json's human version label is not used to decide whether code changed.
          CODE=$(python3 scripts/app-fingerprint.py)
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          if [ "$CODE" != "${{ needs.plan.outputs.code }}" ]; then echo "::notice::The branch moved after the plan job (plan ${{ needs.plan.outputs.code }}, building $CODE). The APK (its built-in VITE_CODE_ID, which src/update.js compares with update/latest.json) and the manifest all use the build-time id $CODE, so installed apps do not see a false mismatch."; fi
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          # Android versionCode must be strictly greater than the currently published build.
          # APK jobs are serialized below; max(now, current+1) also handles two builds in one second.
          BR="${GITHUB_REF_NAME}"
          git fetch -q origin "$BR" || true
          CUR=$(git show "FETCH_HEAD:update/latest.json" 2>/dev/null | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('vcode',0)))" 2>/dev/null || echo 0)
          NOW=$(date -u +%s)
          VCODE=$NOW
          if [ "$VCODE" -le "$CUR" ]; then VCODE=$((CUR + 1)); fi
          if [ "$VCODE" -ge 2147483647 ]; then echo "::error::Android versionCode limit reached"; exit 1; fi
          echo "vcode=$VCODE" >> "$GITHUB_OUTPUT"
          echo "code=$CODE, installed-build floor=$CUR, new versionCode=$VCODE"
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      # BUG-203: keep the Gradle downloads between runs (android/ is generated, so setup-java's own gradle cache cannot be used: it needs gradle files at this point)
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json', 'scripts/install-native.sh') }}
          restore-keys: gradle-${{ runner.os }}-
      - run: npm ci
      - run: npm run build
        env:
          VITE_REPO: ${{ github.repository }}
          VITE_BRANCH: ${{ github.event.repository.default_branch }}
          VITE_CODE_ID: ${{ steps.ver.outputs.code }}
      - name: "Restore signing key (from the repo Actions secrets KEYSTORE_BASE64 + KEYSTORE_PASSWORD; the key is never stored in the repo)"
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$KP" ]; then
            echo "::error::Missing KEYSTORE_BASE64 or KEYSTORE_PASSWORD. Add both under Settings > Secrets and variables > Actions (NOT Codespaces)."
            exit 1
          fi
          # a phone copy can add spaces or line breaks: remove them, then check the text really is base64 (never print the secret itself)
          CLEAN=$(printf '%s' "$KS" | tr -d ' \t\r\n')
          mkdir -p signing
          if ! printf '%s' "$CLEAN" | base64 -d > signing/liquid-dark.keystore 2>/dev/null; then
            echo "::error::KEYSTORE_BASE64 is not valid base64 (${#CLEAN} characters after removing spaces). Open KEYSTORE_BASE64.txt, select ALL of its text, copy it again, and replace the KEYSTORE_BASE64 secret. The text is one long line that starts with MII."
            exit 1
          fi
          if [ ! -s signing/liquid-dark.keystore ]; then echo "::error::KEYSTORE_BASE64 decoded to an empty file. Copy KEYSTORE_BASE64.txt again."; exit 1; fi
          # the real test: the key store opens with the password (catches a cut-off copy and a wrong password)
          if ! keytool -list -keystore signing/liquid-dark.keystore -storetype PKCS12 -storepass "$KP" >/dev/null 2>&1; then
            echo "::error::The key store does not open with KEYSTORE_PASSWORD. Copy KEYSTORE_BASE64.txt again in full, and check KEYSTORE_PASSWORD matches your KEYSTORE_PASSWORD.txt exactly."
            exit 1
          fi
          # the build signs with the key named "liquid dark" (scripts/install-native.sh). Say clearly if this key store does not hold it.
          if ! keytool -list -keystore signing/liquid-dark.keystore -storetype PKCS12 -storepass "$KP" -alias "liquid dark" >/dev/null 2>&1; then
            echo "::error::The key store opens, but it has no key named 'liquid dark'. Use the newest KEYSTORE_BASE64.txt (alias liquid dark) for the KEYSTORE_BASE64 secret."
            exit 1
          fi
          # legacy copy under the old file name, so an older project zip (whose scripts still look for liquid-flac.keystore) also signs with this key. Runner-only file, never committed (*.keystore is git-ignored).
          cp signing/liquid-dark.keystore signing/liquid-flac.keystore
          echo "Signing key restored."
      - name: Create android/ if missing
        run: test -d android || npx cap add android
      - name: Install native plugin
        env:
          LF_VERSION_CODE: ${{ steps.ver.outputs.vcode }}
        run: bash scripts/install-native.sh
      # The app logo is baked into the APK again (no version change). The picture named by app-logo-pic/latest.json becomes the launcher icon (legacy, round and Android 8+ adaptive),
      # the same picture the fingerprint covers, so "new logo uploaded" always means "new APK with that logo". No logo uploaded = Android's generic icon.
      # A picture that is there but unusable still builds (generic icon) but prints a ::warning:: and says so in the run summary. The About logo is also downloaded live (src/applogo.js).
      - name: "Launcher icon from app-logo-pic/ (generic Android icon when no logo is uploaded)"
        id: icon
        run: |
          set -uo pipefail
          python3 -m venv "$RUNNER_TEMP/icon-venv"
          "$RUNNER_TEMP/icon-venv/bin/pip" install --quiet pillow
          set +e
          "$RUNNER_TEMP/icon-venv/bin/python" scripts/apply-app-logo.py
          RC=$?
          set -e
          if [ "$RC" -eq 0 ]; then
            echo "applied=true" >> "$GITHUB_OUTPUT"
            echo "Launcher icon: built from $(python3 -c "import json; print(json.load(open('app-logo-pic/latest.json'))['name'])" 2>/dev/null || echo "(none: generic icon)")" >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" -eq 3 ]; then
            python3 scripts/no-launcher-icon.py android/app/src/main/AndroidManifest.xml
            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "Launcher icon: generic Android icon (no usable logo in app-logo-pic/, see the warning above if one was uploaded)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Could not build the launcher icon (exit $RC)."; exit 1
          fi
      - name: Verify the update installer file path (FileProvider)
        run: |
          set -euo pipefail
          F=android/app/src/main/res/xml/file_paths.xml
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q '<files-path' "$F" || ! grep -q 'path="update/"' "$F"; then echo "::error::file_paths.xml has no files-path update/ entry; the in-app Install button would fail."; exit 1; fi
          if ! grep -q 'androidx.core.content.FileProvider' "$M" || ! grep -q '@xml/file_paths' "$M"; then echo "::error::AndroidManifest has no FileProvider using @xml/file_paths."; exit 1; fi
      - run: npx cap sync android
      - name: Build APK
        env:
          LF_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - name: Verify APK package and Android build number
        env:
          EXPECTED_BUILD: ${{ steps.ver.outputs.vcode }}
          EXPECTED_VERSION: ${{ steps.ver.outputs.version }}
          ICON_APPLIED: ${{ steps.icon.outputs.applied }}
        run: |
          set -euo pipefail
          APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          if [ -z "$AAPT" ] || [ ! -x "$AAPT" ]; then echo "::error::Android aapt tool is missing; cannot verify APK metadata."; exit 1; fi
          BADGING=$("$AAPT" dump badging "$APK_PATH")
          EXPECTED="package: name='com.liquid.flacplayer' versionCode='$EXPECTED_BUILD' versionName='$EXPECTED_VERSION'"
          if ! printf '%s\n' "$BADGING" | grep -Fq "$EXPECTED"; then
            echo "::error::Built APK metadata does not match the fingerprint/build that will be published."
            printf '%s\n' "$BADGING" | grep '^package:' || true
            exit 1
          fi
          echo "Verified package com.liquid.flacplayer, versionName $EXPECTED_VERSION, versionCode $EXPECTED_BUILD."
          # The finished APK must really carry (or really lack) the launcher icon the icon step decided on.
          ICON=$(printf '%s\n' "$BADGING" | sed -n "s/^application: .* icon='\([^']*\)'.*/\1/p" | head -1)
          if [ "$ICON_APPLIED" = "true" ]; then
            if [ -z "$ICON" ]; then echo "::error::The logo was baked in but the built APK has no launcher icon."; exit 1; fi
            echo "Verified launcher icon in the APK: $ICON"
          else
            if [ -n "$ICON" ]; then echo "::warning::No logo was applied but the built APK declares a launcher icon: $ICON"; fi
            echo "Verified: no launcher icon in the APK (generic Android icon)."
          fi
      - name: Show and verify signing certificate
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then echo "::error::Android apksigner is missing; refusing to publish an unverifiable APK."; exit 1; fi
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$CERT_OUTPUT" | head -4
      # Run on every branch build, not only the default branch. Compare against the key
      # currently published on the repository's default branch. Missing evidence fails closed.
      - name: "Guard: fail closed unless the published signing key matches"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          ALLOW_NEW_KEY: ${{ github.event.inputs.allow_new_signing_key }}
        run: |
          set -euo pipefail
          NEW_APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if [ -z "$APKSIGNER" ] || [ ! -x "$APKSIGNER" ]; then echo "::error::apksigner is unavailable; key compatibility cannot be verified."; exit 1; fi
          ALLOW="${ALLOW_NEW_KEY:-false}"
          DEFAULT_REF="refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git fetch -q --no-tags origin "+refs/heads/$DEFAULT_BRANCH:$DEFAULT_REF"; then
            if [ "$ALLOW" = "true" ]; then echo "::warning::Could not fetch the published branch. Explicit allow_new_signing_key override accepted; install over the old app may fail."; exit 0; fi
            echo "::error::Could not fetch the published branch, so the existing signing key cannot be verified. Re-run when GitHub is reachable, or manually tick allow_new_signing_key only when you accept requiring uninstall."; exit 1
          fi

          OLD=""
          OLD_SOURCE=""
          if git cat-file -e "$DEFAULT_REF:update/latest.json" 2>/dev/null; then
            if ! OLD=$(git show "$DEFAULT_REF:update/latest.json" | python3 -c "import json,sys; print(json.load(sys.stdin).get('apk',''))"); then
              echo "::error::The published update/latest.json is unreadable; refusing to publish an APK with an unverified key."; exit 1
            fi
            if ! printf '%s' "$OLD" | grep -qE '^liquid-dark-[0-9a-f]{12}-[0-9]{10}\.apk$'; then
              echo "::error::The published update manifest does not name a valid immutable APK; refusing to skip signing-key verification."; exit 1
            fi
            OLD_SOURCE="manifest"
          else
            # Migration path for a repo that predates update/latest.json: inspect its stable release alias.
            # BUG-327: ask for the 'latest' release by name (the old list call only saw the newest 100 releases); the list call below only tells "no such release" from "GitHub unreachable"
            if gh release view latest >/dev/null 2>&1; then HAS_LATEST=yes
            elif gh release list --limit 1 --json tagName >/dev/null 2>&1; then HAS_LATEST=no
            else
              if [ "$ALLOW" = "true" ]; then echo "::warning::Could not inspect existing releases. Explicit allow_new_signing_key override accepted."; exit 0; fi
              echo "::error::Could not inspect Releases to determine whether an older APK exists; refusing to publish without a key comparison."; exit 1
            fi
            if [ "$HAS_LATEST" = "yes" ]; then OLD="liquid-dark.apk"; OLD_SOURCE="legacy"; fi
          fi

          if [ -z "$OLD" ]; then
            echo "No previously published APK found; this is the first release, so there is no old key to compare."
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/old-apk"
          OLD_PATH="$RUNNER_TEMP/old-apk/$OLD"
          if ! gh release download latest -p "$OLD" -D "$RUNNER_TEMP/old-apk" --clobber >/dev/null 2>&1 || [ ! -s "$OLD_PATH" ]; then
            if [ "$OLD_SOURCE" = "legacy" ]; then
              OLD="liquid-flac.apk"; OLD_PATH="$RUNNER_TEMP/old-apk/$OLD"
              if ! gh release download latest -p "$OLD" -D "$RUNNER_TEMP/old-apk" --clobber >/dev/null 2>&1 || [ ! -s "$OLD_PATH" ]; then OLD_PATH=""; fi
            else OLD_PATH=""; fi
          fi
          if [ -z "$OLD_PATH" ]; then
            if [ "$ALLOW" = "true" ]; then echo "::warning::Could not download the previously published APK. Explicit allow_new_signing_key override accepted; users may need to uninstall first."; exit 0; fi
            echo "::error::Could not download the published APK, so its signing key was not compared. The build is blocked to prevent an update loop. Restore the release asset or explicitly tick allow_new_signing_key."; exit 1
          fi

          digest() {
            local output value
            output=$("$APKSIGNER" verify --print-certs "$1" 2>&1) || return 1
            value=$(printf '%s\n' "$output" | sed -nE 's/.*certificate SHA-256 digest: ([A-Fa-f0-9]{64}).*/\1/p' | head -1)
            [[ "$value" =~ ^[A-Fa-f0-9]{64}$ ]] || return 1
            printf '%s' "${value,,}"
          }
          if ! NEW_D=$(digest "$NEW_APK"); then echo "::error::Could not verify the new APK signing certificate; refusing to publish."; exit 1; fi
          if ! OLD_D=$(digest "$OLD_PATH"); then
            if [ "$ALLOW" = "true" ]; then echo "::warning::Could not read the old APK signing certificate. Explicit allow_new_signing_key override accepted."; exit 0; fi
            echo "::error::Could not read the published APK signing certificate; refusing to publish without a comparison."; exit 1
          fi
          echo "published key SHA-256: $OLD_D"
          echo "new build key SHA-256:  $NEW_D"
          if [ "$OLD_D" = "$NEW_D" ]; then echo "Same signing key as the published build."; exit 0; fi
          if [ "$ALLOW" = "true" ]; then echo "::warning::The signing key CHANGED and allow_new_signing_key is ticked. Phones with the old app must uninstall it before installing this build."; exit 0; fi
          echo "::error::This build is signed with a DIFFERENT key than the published build, so Android cannot install it over the old app and users would loop on Update ready. Restore the original KEYSTORE_BASE64 secret or manually tick allow_new_signing_key only when you accept requiring uninstall."
          exit 1
      - name: Build summary
        run: |
          {
            echo "### Liquid Dark v${{ steps.ver.outputs.version }}"
            echo ""
            echo "- App code id: \`${{ steps.ver.outputs.code }}\` (the app offers **Update ready** when this changes)"
            echo "- APK size: $(du -h android/app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
            echo "- Download: **Releases > Latest build > liquid-dark.apk**"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      # One fixed download page for the phone: Releases > "Latest build" > liquid-dark.apk (no zip to unpack).
      - name: Publish APK to the "latest" release
        id: publish
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          APK="liquid-dark-${{ steps.ver.outputs.code }}-${{ steps.ver.outputs.vcode }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          SHA256=$(sha256sum "$APK" | cut -d' ' -f1)
          echo "APK SHA-256: $SHA256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest build" --latest --notes "Newest debug APK."
          # only the immutable, fingerprinted asset is uploaded here. The friendly alias and the release notes are updated AFTER the manifest is committed (step below), so they can never describe a build the manifest does not.
          gh release upload latest "$APK" "$APK.sha256" --clobber
      # the app polls update/latest.json (raw.githubusercontent, no GitHub API limit). It is written only AFTER the APK is published,
      # so nobody is offered an update that cannot be downloaded yet. (A push made with the Actions token does not start another run.)
      - name: Publish the update manifest
        id: manifest
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          CODE: ${{ steps.ver.outputs.code }}
          VCODE: ${{ steps.ver.outputs.vcode }}
          SHA256: ${{ steps.publish.outputs.sha256 }}
          APK: ${{ steps.publish.outputs.apk }}
        run: |
          set -e
          BR="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # the APK job is serialized so one release asset and its manifest belong to the same build.
          # Keep this last guard too, in case the branch was changed outside this workflow.
          git fetch -q origin "$BR" || true
          CUR=$(git show "FETCH_HEAD:update/latest.json" 2>/dev/null | python3 -c "import json,sys; print(int(json.load(sys.stdin).get('vcode',0)))" 2>/dev/null || echo 0)
          if [ "$CUR" -ge "$VCODE" ]; then echo "A newer manifest (build $CUR) is already published."; exit 0; fi
          if ! printf '%s' "$SHA256" | grep -qE '^[0-9a-f]{64}$'; then echo "::error::Missing or invalid APK SHA-256"; exit 1; fi
          mkdir -p update
          if ! printf '%s' "$APK" | grep -qE '^liquid-dark-[0-9a-f]{12}-[0-9]{10}\.apk$'; then echo "::error::Invalid versioned APK asset name"; exit 1; fi
          printf '{"code":"%s","apk":"%s","vcode":%s,"sha256":"%s"}\n' "$CODE" "$APK" "$VCODE" "$SHA256" > update/latest.json
          git add update/latest.json
          if git diff --cached --quiet; then echo "Manifest already up to date."; echo "published=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -q -m "Update manifest: code $CODE"
          for i in 1 2 3 4; do
            if git push -q origin "HEAD:$BR"; then echo "published=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            echo "Push was rejected (the branch changed meanwhile): pulling and trying again ($i of 4)."
            # BUG-325: no -X theirs. A conflict stops with a warning instead of overwriting the other run's manifest.
            if ! git pull -q --rebase --autostash origin "$BR"; then
              CONFLICT=$(git diff --name-only --diff-filter=U 2>/dev/null | tr '\n' ' ')
              git rebase --abort 2>/dev/null || true
              echo "::warning::Another run changed update/latest.json meanwhile, so nothing was overwritten. Conflicting files: ${CONFLICT:-unknown}"
              break
            fi
          done
          echo "::error::Could not push update/latest.json. Re-run failed jobs."; exit 1
      # alias + release notes follow the manifest. Skipped when a newer manifest already exists, so an older run can never overwrite them.
      - name: Update the release alias and notes
        if: steps.manifest.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APK: ${{ steps.publish.outputs.apk }}
          SHA256: ${{ steps.publish.outputs.sha256 }}
        run: |
          set -e
          cp "$APK" liquid-dark.apk
          printf '%s  liquid-dark.apk\n' "$SHA256" > liquid-dark.apk.sha256
          # Legacy alias: phones that still run an older updater look for liquid-flac.apk, but only when the manifest cannot be read. Same bytes, so they never find a stale file.
          cp "$APK" liquid-flac.apk
          printf '%s  liquid-flac.apk\n' "$SHA256" > liquid-flac.apk.sha256
          gh release upload latest liquid-dark.apk liquid-dark.apk.sha256 liquid-flac.apk liquid-flac.apk.sha256 --clobber
          # BUG-191: keep only the newest versioned APK and its checksum on the "latest" release; older ones are deleted (the fixed liquid-dark.apk / liquid-flac.apk files are overwritten, not kept)
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null | grep -E '^liquid-dark-[0-9a-f]{12}-[0-9]{10}\.apk(\.sha256)?$' | grep -vxF -e "$APK" -e "$APK.sha256" | while read -r old; do gh release delete-asset latest "$old" --yes || echo "::warning::could not delete old release asset $old"; done || true
          # code is the source fingerprint; build is Android versionCode; SHA-256 binds the manifest to immutable APK bytes.
          gh release edit latest --notes "Liquid Dark v${{ steps.ver.outputs.version }}. Built on $(date -u +%Y-%m-%d). code ${{ steps.ver.outputs.code }}. build ${{ steps.ver.outputs.vcode }}. sha256 $SHA256. Install liquid-dark.apk."
