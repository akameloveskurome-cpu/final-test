            done < <(find credit-gif-pic -maxdepth 1 -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$ENEW" ]; then
              python3 - "$ENEW" "$ECOMM" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$EMOVED" <<'PYCREDIT'
          import json, subprocess, sys
          name, sha, run, moved = sys.argv[1:5]
          prev = {}
