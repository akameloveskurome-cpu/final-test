              git add -A splash-pic
              if ! git diff --cached --quiet; then git commit -m "Splash picture: newest image is $SPNEW"; push_retry; fi
            elif [ -f splash-pic/latest.json ]; then
              git rm -q -f splash-pic/latest.json; git commit -q -m "Splash picture: no picture left"; push_retry
            fi
          fi
          # credit-gif-pic/ = the live picture or GIF below Settings > About > Credits.
          # The app already polls this manifest every second; this step keeps it in sync with the folder.
          if [ -f package.json ] && [ ! -e credit-gif-pic/.gitkeep ]; then
            mkdir -p credit-gif-pic && : > credit-gif-pic/.gitkeep
