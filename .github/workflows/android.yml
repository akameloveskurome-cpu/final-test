# Liquid Dark build (v208).
# Builds the Android app from the project zip in the repo root and publishes the APK on the repo Releases page.
# This file lives at .github/workflows/android.yml; a project zip never replaces it.
# Cross-checked against the project code (update.js, app-fingerprint.py, install-native.sh, apply-app-logo.py, the *-pic modules and the Java updater): manifest fields, notes format, signing alias, picture-folder rules and exit codes all agree. Paste this file into GitHub by hand; unpacking a zip never updates it.
name: Liquid Dark build
on:
  push:
    branches: ["**"]   # branches only: a tag push used to start a full run whose checkout/push steps assume a branch name
  workflow_dispatch:
    inputs:
      resend_popup:
        description: "Show the popup picture again to everybody (the newest notification picture; does not rebuild the APK). Same picture is fine."
        type: boolean
        default: false
      resend_credit:
        description: "Send the Credits picture again to everybody (Actions > Run workflow). Same picture is fine."
        type: boolean
        default: false
      resend_update_popup:
        description: "Send the update-screen picture again to everybody (Actions > Run workflow). Same picture is fine."
        type: boolean
        default: false
      resend_splash:
        description: "Show the splash picture again to everybody (Actions > Run workflow). Same picture is fine."
        type: boolean
        default: false
      resend_logo:
        description: "Send the app logo again to everybody (rebuilds the APK with the launcher icon and updates the About logo). Same picture is fine."
        type: boolean
        default: false
      resend_bgallow:
        description: "Send the background-allow picture again to everybody (Actions > Run workflow). Same picture is fine."
        type: boolean
        default: false
      resend_statban:
        description: "Send the Home stats-banner picture again to everybody (Actions > Run workflow). Same picture is fine."
        type: boolean
        default: false
      force_rebuild:
        description: "Force a new APK even when the app fingerprint is unchanged (normally leave unticked)."
        type: boolean
        default: false
      allow_new_signing_key:
        description: "Publish an APK signed with a DIFFERENT key than the published one. Phones must uninstall the old app first, so leave unticked unless you really changed the key."
        type: boolean
        default: false

# BUG-330: read-only for the whole workflow. Only the publish job below asks for write, so the narrowest scope stays with the job that needs it.
permissions:
  contents: read

# concurrency is per job. The unpack job (writes notification-popup-gif-pic/latest.json) is NEVER cancelled, so a quick second push can no longer kill a popup send halfway.
# Tests can be cancelled by a newer push. APK publication is serialized; the app manifest points at an immutable build-specific APK asset.

jobs:
  # Step 0: "upload a zip" setup. If a .zip sits in the repo root, unpack it into the repo (replacing the old files),
  # delete the zip and commit. The .github folder is never touched (Actions may not edit workflow files).
  # No zip = nothing happens. Later jobs only run once the project files (package.json) exist.
  unpack:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # BUG-326: was 10; a timeout could stop the job after a picture was written but before its latest.json was pushed
    concurrency: { group: "unpack-${{ github.ref }}", cancel-in-progress: false }
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.u.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0, ref: "${{ github.ref_name }}" }   # full history; branch tip so a queued run sees the previous run's bot commits
      # signing secrets must never sit in the repo. .gitignore cannot stop a web-page upload, so this step does: it fails the run (and so the build)
      # when a key file is tracked or is inside an uploaded zip. Delete the file in GitHub, then read signing/README.md about whether to replace the key.
      - name: Refuse committed signing secrets
        run: |
          # BUG-446 / BUG-448: names containing KEYSTORE or ending in key.txt / key.properties, more extensions (pfx, b64), trailing spaces allowed;
          # git ls-files -z so non-ASCII names are not octal-quoted (the quote broke the $ anchor).
          PAT='(KEYSTORE[^/]*\.(txt|b64|base64)|(^|[/ _.-])key\.(txt|properties))[[:space:]]*$|\.(keystore|jks|p12|pfx)(\.b64)?[[:space:]]*$'
          BAD=$(git ls-files -z | tr '\0' '\n' | grep -iE "$PAT" || true)
          for Z in ./*.zip; do
            [ -f "$Z" ] || continue
            BAD="$BAD"$'\n'"$(unzip -Z1 "$Z" 2>/dev/null | grep -iE "$PAT" | sed "s|^|$Z: |" || true)"
          done
          BAD=$(printf '%s' "$BAD" | sed '/^$/d')
          if [ -n "$BAD" ]; then
            echo "::error::Signing secrets are in the repository or in an uploaded zip. Delete these files, then re-run. If the repo is public, treat the key as exposed (see signing/README.md):"
            printf '%s\n' "$BAD"
            exit 1
          fi
          echo "No signing secrets found in the repo or zip."
      - name: Unpack uploaded zip (if any)
        id: u
        env:
          RESEND: ${{ github.event.inputs.resend_popup }}
          RESEND_LOGO: ${{ github.event.inputs.resend_logo }}
          RESEND_CREDIT: ${{ github.event.inputs.resend_credit }}
          RESEND_UPDATE_POPUP: ${{ github.event.inputs.resend_update_popup }}
          RESEND_SPLASH: ${{ github.event.inputs.resend_splash }}
          RESEND_BGALLOW: ${{ github.event.inputs.resend_bgallow }}
          RESEND_STATBAN: ${{ github.event.inputs.resend_statban }}
        run: |
          set -e
          export LC_ALL=C   # byte-order file name comparison, the same on every runner
          # Push, and if the branch moved meanwhile (another run or an upload landed first), pull it in and push again.
          BR="${GITHUB_REF_NAME}"
          push_retry() {
            for i in 1 2 3 4; do
              if git push -q origin "HEAD:$BR"; then return 0; fi
              echo "Push was rejected (the branch changed meanwhile): pulling and trying again ($i of 4)."
              # BUG-325: no -X theirs. A clean rebase (other files changed) is retried; a conflict stops here with a warning, so nothing is overwritten.
              if ! git pull -q --rebase origin "$BR"; then
                CONFLICT=$(git diff --name-only --diff-filter=U 2>/dev/null | tr '\n' ' ')
                git rebase --abort 2>/dev/null || true
                echo "::warning::Another run changed the same files, so nothing was overwritten. Conflicting files: ${CONFLICT:-unknown}"
                echo "::error::Could not push safely. Re-run failed jobs after checking the warning."; return 1
              fi
            done
            echo "::error::Could not push: the branch kept changing. Re-run failed jobs."; return 1
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # pictures are sent ONLY from the notification-popup-gif-pic/ folder (upload there directly). Pictures in the repo root are ignored.
          MOVED=0   # 1 only when the popup picture is re-sent on purpose (Run workflow with resend_popup ticked, below); pictures in the repo root are ignored
          # GitHub makes NO commit when you upload a file that is identical to the one already there, so nothing can start this workflow. The button for that case: Actions > Liquid Dark build > Run workflow (resend_popup ticked) gives the newest picture a new stamp.
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${RESEND:-}" = "true" ]; then MOVED=1; fi
          LMOVED=0   # same idea for the app logo (button below, or a resend marker file in app-logo-pic/)
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${RESEND_LOGO:-}" = "true" ]; then LMOVED=1; fi
          # BUG-189: with several zips in the root the one committed LAST wins (file times are all the checkout time, so ls -t chose at random)
          Z=""; ZBEST=-1; ZN=0
          for ZC in ./*.zip; do
            [ -f "$ZC" ] || continue
            ZN=$((ZN + 1)); ZT=$(git log -1 --format=%ct -- "$ZC" 2>/dev/null || true); ZT=${ZT:-0}
            if [ "$ZT" -ge "$ZBEST" ]; then ZBEST=$ZT; Z=$ZC; fi
          done
          if [ "$ZN" -gt 1 ]; then echo "::warning::$ZN zip files are in the repo root. Only the newest one ($Z) is unpacked; delete the others."; fi
          if [ -n "$Z" ]; then
            echo "Unpacking $Z"
            rm -rf /tmp/x && mkdir /tmp/x && unzip -q "$Z" -d /tmp/x
            SRC=/tmp/x
            # zip made with one top folder? use what is inside it
            # BUG-188: ignore __MACOSX and dot entries when counting top entries; the zip must hold package.json at the chosen root BEFORE anything is deleted
            rm -rf /tmp/x/__MACOSX
            TOP=$(ls /tmp/x | wc -l)
            if [ "$TOP" -eq 1 ] && [ -d "/tmp/x/$(ls /tmp/x)" ]; then SRC="/tmp/x/$(ls /tmp/x)"; fi
            if [ ! -f "$SRC/package.json" ]; then
              echo "::error::The zip $Z has no package.json at its top level (or inside its single top folder). Nothing was deleted or replaced; the zip was removed from the repo. Upload a correct project zip."
              rm -f "$Z"; git add -A; git commit -q -m "Remove invalid zip" || true; push_retry
              exit 1
            fi
            rm -rf "$SRC/.github" "$SRC/.git"
            rm -f "$Z"
            # replace everything except .github: drop all tracked files, then copy the zip's files in
            git ls-files -z -- . ':(exclude).github' ':(exclude)notification-popup-gif-pic' ':(exclude)app-logo-pic' ':(exclude)update' ':(exclude)update-popup-gif-pic' ':(exclude)credit-gif-pic' ':(exclude)background-allow-gif-pic' ':(exclude)stats-banner-gif-pic' ':(exclude)splash-pic' | xargs -0 -r git rm -q -f --
            # Remote media folders are managed separately; preserve uploads when replacing app source from a zip.
            if [ -d notification-popup-gif-pic ]; then rm -rf "$SRC/notification-popup-gif-pic"; fi
            if [ -d app-logo-pic ]; then rm -rf "$SRC/app-logo-pic"; fi
            if [ -d update-popup-gif-pic ]; then rm -rf "$SRC/update-popup-gif-pic"; fi   # the update popup picture folder is managed separately, like notification-popup-gif-pic/
            if [ -d splash-pic ]; then rm -rf "$SRC/splash-pic"; fi   # the splash picture folder is managed separately too
            if [ -d credit-gif-pic ]; then rm -rf "$SRC/credit-gif-pic"; fi
            if [ -d background-allow-gif-pic ]; then rm -rf "$SRC/background-allow-gif-pic"; fi   # managed separately too
            if [ -d stats-banner-gif-pic ]; then rm -rf "$SRC/stats-banner-gif-pic"; fi
            rm -rf "$SRC/update"   # update/latest.json is written by the build, never by a zip
            cp -a "$SRC"/. ./
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack uploaded zip" || echo "Nothing changed."
            push_retry
          else
            echo "No zip in the repo root: nothing to unpack."
          fi
          # the notification-popup-gif-pic/ folder always exists after the first run (git cannot keep an empty folder, so it holds a small .gitkeep file)
          if [ -f package.json ] && [ ! -e notification-popup-gif-pic/.gitkeep ]; then
            mkdir -p notification-popup-gif-pic && : > notification-popup-gif-pic/.gitkeep
            git add -A notification-popup-gif-pic
            git commit -m "Create notification-popup-gif-pic/ folder" || true
            push_retry
          fi
          # RESEND MARKERS. Dropping the same picture again makes no commit on GitHub, so nothing could start this workflow.
          # A file whose name starts with "resend" (for example resend.txt) dropped into notification-popup-gif-pic/ or app-logo-pic/ is a real new file: it starts the workflow,
          # counts as a new send of that folder's newest picture (same picture is fine), and is deleted again here, so the same marker can be dropped next time too.
          markers() { find "$1" -maxdepth 1 -type f -iname 'resend*' ! -iname '*.gif' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.webp' ! -iname '*.bmp' -print0; }   # never a picture, even one named "resend..."
          if [ -d notification-popup-gif-pic ] && [ -n "$(markers notification-popup-gif-pic | tr -d '\0')" ]; then MOVED=1; markers notification-popup-gif-pic | xargs -0 -r git rm -q -f --; fi
          if [ -d app-logo-pic ] && [ -n "$(markers app-logo-pic | tr -d '\0')" ]; then LMOVED=1; markers app-logo-pic | xargs -0 -r git rm -q -f --; fi
          if ! git diff --cached --quiet; then git commit -q -m "Resend marker used"; push_retry; fi
          # app-logo-pic/ is independent from notification-popup-gif-pic/. Upload logo images directly into app-logo-pic/.
          # app-logo-pic/latest.json selects the About logo image, which the app downloads live from app-logo-pic/ (checked every second). The same picture is baked into the APK as the launcher icon by scripts/apply-app-logo.py in the apk job.
          if [ -f package.json ] && [ ! -e app-logo-pic/.gitkeep ]; then
            mkdir -p app-logo-pic && : > app-logo-pic/.gitkeep
            git add -A app-logo-pic
            git commit -m "Create app-logo-pic/ folder" || true
            push_retry
          fi
          if [ -d app-logo-pic ]; then
            LNEW=""; LCOMM=""; LCOUNT=-1
            while IFS= read -r -d '' f; do
              sha=$(git log -1 --format=%H -- "$f" 2>/dev/null || true)
              rank=0; [ -n "$sha" ] && rank=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
              if [ "$rank" -gt "$LCOUNT" ] || { [ "$rank" -eq "$LCOUNT" ] && [ "$(basename "$f")" != "$LNEW" ] && [ "$(printf '%s\n%s\n' "$LNEW" "$(basename "$f")" | LC_ALL=C sort | tail -1)" = "$(basename "$f")" ]; }; then LCOUNT=$rank; LNEW=$(basename "$f"); LCOMM=$sha; fi
            done < <(find app-logo-pic -maxdepth 1 -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$LNEW" ]; then
              python3 - "$LNEW" "$LCOMM" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$LMOVED" <<'PYLOGO'
          import json, subprocess, sys
          name, sha, run, moved = sys.argv[1:5]
          prev = {}
          try: prev = json.load(open('app-logo-pic/latest.json'))
          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run                                   # sent again on purpose (marker file or Run workflow): always a new send, even for the same picture
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = 'f' + (sha[:12] if sha else run)   # BUG-192: the newest picture was deleted and an older one is now newest: new stamp so the app shows it (the app caches by stamp)
          else: stamp = 'l' + (sha[:12] if sha else run)
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('app-logo-pic/latest.json', 'w'))
          PYLOGO
              git add -A app-logo-pic
              if ! git diff --cached --quiet; then git commit -m "App logo: newest image is $LNEW"; push_retry; fi
            elif [ -f app-logo-pic/latest.json ]; then
              git rm -q -f app-logo-pic/latest.json
              git commit -q -m "App logo: no picture left"
              push_retry
            fi
          fi
          # notification-popup-gif-pic/latest.json is polled every second while foregrounded and explicitly on native resume.
          # notification-popup-gif-pic/latest.json names the newest picture and carries a "stamp". The app reads it first (raw.githubusercontent has no API limit, unlike the GitHub API that shared mobile networks often hit).
          # The stamp changes at EVERY upload, even when the same picture is sent again: the app shows the popup again whenever the stamp is new.
          if [ -d notification-popup-gif-pic ]; then
            NEWEST=""; BEST=-1; NSHA=""
            while IFS= read -r -d '' f; do
              # rank by position in the history, not by commit time: two commits in the same second tied, and then the alphabetically LAST file won (maybe the old picture)
              sha=$(git log -1 --format=%H -- "$f" 2>/dev/null || true); t=0; [ -n "$sha" ] && t=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
              if [ "$t" -ge "$BEST" ]; then BEST=$t; NEWEST=$(basename "$f"); NSHA="$sha"; fi
            done < <(find notification-popup-gif-pic -maxdepth 1 -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$NEWEST" ]; then
              python3 - "$NEWEST" "$NSHA" "$MOVED" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" <<'PY'
          import json, os, subprocess, sys
          name, sha, moved, run = sys.argv[1:5]
          prev = {}
          try: prev = json.load(open('notification-popup-gif-pic/latest.json'))
          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run                                   # a picture was just uploaded: always a new send
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']   # nothing new: keep the stamp, nobody sees the popup again
          # the newest picture was DELETED, so an older one became "newest" (its commit is an ANCESTOR of the previous newest): new stamp so the app shows it (the app caches by stamp; same as the other picture folders)
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = 'f' + (sha[:12] if sha else run)
          else: stamp = 's' + sha[:12]                                         # a picture was added / replaced straight in notification-popup-gif-pic/
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('notification-popup-gif-pic/latest.json', 'w'))
          PY
              git add -A notification-popup-gif-pic
              if ! git diff --cached --quiet; then git commit -m "Popup: newest picture is $NEWEST"; push_retry; fi
            elif [ -f notification-popup-gif-pic/latest.json ]; then
              git rm -q -f notification-popup-gif-pic/latest.json
              git commit -q -m "Popup: no picture left"
              push_retry
            fi
          fi
          # update-popup-gif-pic/ = the picture or GIF on the "Update available / Update ready" popups. Upload it directly into that folder.
          # The app reads update-popup-gif-pic/latest.json only while an update is waiting (live, no rebuild). The newest picture in the folder wins.
          if [ -f package.json ] && [ ! -e update-popup-gif-pic/.gitkeep ]; then
            mkdir -p update-popup-gif-pic && : > update-popup-gif-pic/.gitkeep
            git add -A update-popup-gif-pic
            git commit -m "Create update-popup-gif-pic/ folder" || true
            push_retry
          fi
          # update-popup-gif-pic/ resend: the Run workflow checkbox, or a resend*.txt file dropped into update-popup-gif-pic/ (deleted again here).
          UMOVED=0
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${RESEND_UPDATE_POPUP:-}" = "true" ]; then UMOVED=1; fi
          if [ -d update-popup-gif-pic ]; then
            while IFS= read -r -d '' m; do UMOVED=1; git rm -q -f -- "$m"; done < <(find update-popup-gif-pic -maxdepth 1 -type f -iname 'resend*' ! -iname '*.gif' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.webp' ! -iname '*.bmp' -print0)
            if ! git diff --cached --quiet; then git commit -q -m "Update popup resend marker used"; push_retry; fi
          fi
          if [ -d update-popup-gif-pic ]; then
            UNEW=""; UCOMM=""; UCOUNT=-1
            while IFS= read -r -d '' f; do
              sha=$(git log -1 --format=%H -- "$f" 2>/dev/null || true)
              rank=0; [ -n "$sha" ] && rank=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
              if [ "$rank" -gt "$UCOUNT" ] || { [ "$rank" -eq "$UCOUNT" ] && [[ "$(basename "$f")" > "$UNEW" ]]; }; then UCOUNT=$rank; UNEW=$(basename "$f"); UCOMM=$sha; fi
            done < <(find update-popup-gif-pic -maxdepth 1 -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$UNEW" ]; then
              # any size works. The app downloads this picture once per upload, on every phone with an update waiting: only warn when it is really big
              if [ "$(stat -c%s "update-popup-gif-pic/$UNEW" 2>/dev/null || echo 0)" -gt 26214400 ]; then echo "::warning::update-popup-gif-pic/$UNEW is larger than 25 MB. It still works (any size is shown), but phones on mobile data download it every time it changes."; fi
              python3 - "$UNEW" "$UCOMM" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$UMOVED" <<'PYUPD'
          import json, subprocess, sys
          name, sha, run, moved = sys.argv[1:5]
          prev = {}
          try: prev = json.load(open('update-popup-gif-pic/latest.json'))
          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run   # sent again on purpose (resend marker or Run workflow): always a new send, even for the same picture
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = 'f' + (sha[:12] if sha else run)   # BUG-192: the newest picture was deleted and an older one is now newest: new stamp so the app shows it (the app caches by stamp)
          else: stamp = 'u' + (sha[:12] if sha else run)
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('update-popup-gif-pic/latest.json', 'w'))
          PYUPD
              git add -A update-popup-gif-pic
              if ! git diff --cached --quiet; then git commit -m "Update popup: newest picture is $UNEW"; push_retry; fi
            elif [ -f update-popup-gif-pic/latest.json ]; then
              git rm -q -f update-popup-gif-pic/latest.json; git commit -q -m "Update popup: no picture left"; push_retry   # the picture was deleted: the popup goes back to the plain one
            fi
          fi
          # splash-pic/ = the picture (no GIF) shown centered at medium size (about 300 dp) for 1 second when the app opens. Upload it directly into that folder.
          # The app reads splash-pic/latest.json every second (1000 ms). The newest picture in the folder wins. No rebuild.
          if [ -f package.json ] && [ ! -e splash-pic/.gitkeep ]; then
            mkdir -p splash-pic && : > splash-pic/.gitkeep
            git add -A splash-pic
            git commit -m "Create splash-pic/ folder" || true
            push_retry
          fi
          # RESEND MARKER. An identical picture uploaded again makes no commit, so a file named resend*.txt dropped into splash-pic/ is the way to send it again.
          # It is a real new file (starts the workflow), counts as a new send, and is deleted again here.
          SPMOVED=0
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${RESEND_SPLASH:-}" = "true" ]; then SPMOVED=1; fi
          if [ -d splash-pic ]; then
            while IFS= read -r -d '' m; do SPMOVED=1; git rm -q -f -- "$m"; done < <(find splash-pic -maxdepth 1 -type f -iname 'resend*' ! -iname '*.gif' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.webp' ! -iname '*.bmp' -print0)
            if ! git diff --cached --quiet; then git commit -q -m "Splash picture resend marker used"; push_retry; fi
          fi
          if [ -d splash-pic ]; then
            for g in splash-pic/*.gif splash-pic/*.GIF; do
              [ -f "$g" ] && echo "::warning::$g is a GIF. The splash screen shows still pictures only (png, jpg, webp, bmp), so this file is ignored."
            done
          fi
          if [ -d splash-pic ]; then
            SPNEW=""; SPCOMM=""; SPCOUNT=-1
            while IFS= read -r -d '' f; do
              sha=$(git log -1 --format=%H -- "$f" 2>/dev/null || true)
              rank=0; [ -n "$sha" ] && rank=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
              if [ "$rank" -gt "$SPCOUNT" ] || { [ "$rank" -eq "$SPCOUNT" ] && [[ "$(basename "$f")" > "$SPNEW" ]]; }; then SPCOUNT=$rank; SPNEW=$(basename "$f"); SPCOMM=$sha; fi
            done < <(find splash-pic -maxdepth 1 -type f \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$SPNEW" ]; then
              python3 - "$SPNEW" "$SPCOMM" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$SPMOVED" <<'PYSPLASH'
          import json, subprocess, sys
          name, sha, run, moved = sys.argv[1:5]
          prev = {}
          try: prev = json.load(open('splash-pic/latest.json'))
          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run   # sent again on purpose (resend marker or Run workflow): always a new send, even for the same picture
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = 'f' + (sha[:12] if sha else run)   # BUG-192: the newest picture was deleted and an older one is now newest: new stamp so the app shows it (the app caches by stamp)
          else: stamp = 'p' + (sha[:12] if sha else run)
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('splash-pic/latest.json', 'w'))
