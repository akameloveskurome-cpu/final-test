            git commit -m "Create credit-gif-pic/ folder" || true
            push_retry
          fi
          EMOVED=0
          if [ "${GITHUB_EVENT_NAME:-}" = "workflow_dispatch" ] && [ "${RESEND_CREDIT:-}" = "true" ]; then EMOVED=1; fi
          if [ -d credit-gif-pic ]; then
            while IFS= read -r -d '' m; do EMOVED=1; git rm -q -f -- "$m"; done < <(find credit-gif-pic -maxdepth 1 -type f -iname 'resend*' ! -iname '*.gif' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.webp' ! -iname '*.bmp' -print0)
            if ! git diff --cached --quiet; then git commit -q -m "Credits picture resend marker used"; push_retry; fi
          fi
          if [ -d credit-gif-pic ]; then
            ENEW=""; ECOMM=""; ECOUNT=-1
            while IFS= read -r -d '' f; do
