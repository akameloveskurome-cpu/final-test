          if [ -d stats-banner-gif-pic ]; then
            while IFS= read -r -d '' m; do SMOVED=1; git rm -q -f -- "$m"; done < <(find stats-banner-gif-pic -maxdepth 1 -type f -iname 'resend*' ! -iname '*.gif' ! -iname '*.png' ! -iname '*.jpg' ! -iname '*.jpeg' ! -iname '*.webp' ! -iname '*.bmp' -print0)
            if ! git diff --cached --quiet; then git commit -q -m "Stats-banner picture resend marker used"; push_retry; fi
          fi
          if [ -d stats-banner-gif-pic ]; then
            SNEW=""; SCOMM=""; SCOUNT=-1
            while IFS= read -r -d '' f; do
              sha=$(git log -1 --format=%H -- "$f" 2>/dev/null || true)
              rank=0; [ -n "$sha" ] && rank=$(git rev-list --count "$sha" 2>/dev/null || echo 0)
              if [ "$rank" -gt "$SCOUNT" ] || { [ "$rank" -eq "$SCOUNT" ] && [[ "$(basename "$f")" > "$SNEW" ]]; }; then SCOUNT=$rank; SNEW=$(basename "$f"); SCOMM=$sha; fi
            done < <(find stats-banner-gif-pic -maxdepth 1 -type f \( -iname '*.gif' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.webp' -o -iname '*.bmp' \) -print0 | sort -z)
            if [ -n "$SNEW" ]; then
              python3 - "$SNEW" "$SCOMM" "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$SMOVED" <<'PYSB'
          import json, subprocess, sys
          name, sha, run, moved = sys.argv[1:5]
          prev = {}
          try: prev = json.load(open('stats-banner-gif-pic/latest.json'))
          except FileNotFoundError: pass
          except Exception as e: print('::warning::saved popup state could not be read, starting fresh: %s' % e)   # BUG-324
          if moved == '1': stamp = 'r' + run
          elif prev.get('commit') == sha and prev.get('name') == name and prev.get('stamp'): stamp = prev['stamp']
          elif prev.get('stamp') and prev.get('commit') and prev['commit'] != sha and subprocess.call(['git', 'merge-base', '--is-ancestor', sha, prev['commit']], stderr=subprocess.DEVNULL) == 0: stamp = 'f' + (sha[:12] if sha else run)   # BUG-192: the newest picture was deleted and an older one is now newest: new stamp so the app shows it (the app caches by stamp)
          else: stamp = 'n' + (sha[:12] if sha else run)
          json.dump({'name': name, 'commit': sha, 'stamp': stamp}, open('stats-banner-gif-pic/latest.json', 'w'))
          PYSB
              git add -A stats-banner-gif-pic
              if ! git diff --cached --quiet; then git commit -m "Stats-banner picture: newest image is $SNEW"; push_retry; fi
