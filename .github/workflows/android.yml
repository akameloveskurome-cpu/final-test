          # stats-banner-gif-pic/ = the picture or GIF in the glass box above Listening Stats on Home. Same mechanics: live, polled every second, no rebuild.
          if [ -f package.json ] && [ ! -e stats-banner-gif-pic/.gitkeep ]; then
